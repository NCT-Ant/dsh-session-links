name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build bundle archive
        run: |
          mkdir -p dist
          zip -j "dist/dsh-session-links-${{ steps.ver.outputs.version }}.zip" \
            index.js client.js cordis.patch.yml package.json README.md LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "dist/dsh-session-links-${{ steps.ver.outputs.version }}.zip" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
